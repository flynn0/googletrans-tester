name: Test Implementations Matrix

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      target_package:
        description: "Specific package to test (leave blank for all 27 packages)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "test-matrix"
  cancel-in-progress: false

jobs:
  run-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Harness Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harness Test Suite
        run: |
          pytest tests/ -v

      - name: Fetch Telemetry & Statistics
        run: |
          python runner/fetch_stats.py

      - name: Run Test Matrix across Implementations
        run: |
          if [ -n "${{ inputs.target_package }}" ]; then
            python runner/run_matrix.py --package "${{ inputs.target_package }}"
          else
            python runner/run_matrix.py
          fi

      - name: Synchronize Dashboard Data
        run: |
          python scripts/sync_dashboard_data.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/matrix_results.json data/latest_results.json data/history.db data/runs_history.json dashboard/public/results.json dashboard/public/history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): update test results and stats [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes to commit."
          fi

  trigger-deploy:
    needs: run-matrix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: |
          npm ci

      - name: Build Dashboard
        working-directory: dashboard
        run: |
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dashboard/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
